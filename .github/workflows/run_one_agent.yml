name: Run Single Agent (Multi-Seed Training)

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      grid_size:
        description: 'Environment grid size'
        required: false
        default: '6x6'
        type: choice
        options:
          - 6x6
          - 8x8
          - 10x10
      num_seeds:
        description: 'Number of seeds for multi-seed training (1 to 10)'
        required: false
        default: '3'
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.agent }}, ${{ matrix.env_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [ddqn_baseline, ddqn_reward_shaping]
        env_id: [MiniGrid-Empty-Random-6x6-v0, MiniGrid-DoorKey-6x6-v0]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: "Train Single Agent Across All Seeds (Shared Replay Buffer)"
        run: |
          GRID_SIZE="${{ github.event.inputs.grid_size || '6x6' }}"
          ENV_ID=$(echo "${{ matrix.env_id }}" | sed "s/6x6/$GRID_SIZE/")
          NUM_SEEDS="${{ github.event.inputs.num_seeds || '3' }}"
          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"

          if [ "$GRID_SIZE" = "10x10" ]; then
            # 1M per seed × num_seeds (agent trains on all simultaneously)
            TIMESTEPS=$((1000000 * NUM_SEEDS))
            EXPLORE_FRAC=0.80
            END_E=0.1
          elif [ "$GRID_SIZE" = "8x8" ]; then
            TIMESTEPS=$((500000 * NUM_SEEDS))
            EXPLORE_FRAC=0.50
            END_E=0.01
          else
            TIMESTEPS=$((200000 * NUM_SEEDS))
            EXPLORE_FRAC=0.50
            END_E=0.01
          fi
          
          echo "Training single ${{ matrix.agent }} on $ENV_ID across $NUM_SEEDS seeds"
          echo "Total timesteps: $TIMESTEPS (shared across all seeds), end_e: $END_E"

          python src/train_multi_seed.py \
            --agent ${{ matrix.agent }} \
            --env-id $ENV_ID \
            --num-seeds $NUM_SEEDS \
            --total-timesteps $TIMESTEPS \
            --max-steps $MAX_STEPS \
            --exploration-fraction $EXPLORE_FRAC \
            --epsilon-schedule linear \
            --end-e $END_E \
            --fixed-layout
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: result_${{ matrix.agent }}_${{ matrix.env_id }}_${{ github.event.inputs.grid_size || '6x6' }}_multiseed
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  plot:
    name: Evaluate & Generate Plots (Single Agent)
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result_*
          path: results/
          merge-multiple: true

      - name: Flatten Multi-Seed Results for Evaluation
        run: |
          echo "=== Flattening multi-seed results into per-seed directories ==="
          for run_dir in results/*/; do
            if [ -d "$run_dir" ]; then
              echo "Processing run_dir: $run_dir"
              for seed_dir in "$run_dir"seed_*/; do
                if [ -d "$seed_dir" ]; then
                  echo "  Found seed_dir: $seed_dir"
                  
                  # Extract env_id, agent, and seed from config.json
                  ENV_ID=$(python3 -c "import json; c=json.load(open('${seed_dir}config.json')); print(c['env_id'])" 2>/dev/null || echo "")
                  AGENT=$(python3 -c "import json; c=json.load(open('${seed_dir}config.json')); print(c['exp_name'])" 2>/dev/null || echo "")
                  SEED=$(python3 -c "import json; c=json.load(open('${seed_dir}config.json')); print(c['seed'])" 2>/dev/null || echo "")
                  
                  if [ -n "$ENV_ID" ] && [ -n "$AGENT" ] && [ -n "$SEED" ]; then
                    TARGET="results/${ENV_ID}__${AGENT}__${SEED}__multiseed"
                    echo "    Copying $seed_dir -> $TARGET"
                    cp -r "$seed_dir" "$TARGET"

                    # Also copy metrics.csv from parent run dir if it exists
                    if [ -f "${run_dir}metrics.csv" ] && [ ! -f "${TARGET}/metrics.csv" ]; then
                      cp "${run_dir}metrics.csv" "${TARGET}/metrics.csv"
                    fi
                    
                    echo "    Contents of $TARGET:"
                    ls -la "$TARGET/" | head -15
                  else
                    echo "    WARNING: Could not extract ENV_ID=$ENV_ID AGENT=$AGENT SEED=$SEED from $seed_dir"
                  fi
                fi
              done
            fi
          done
          
          echo ""
          echo "=== All flattened result directories ==="
          ls -la results/ | grep -E "^d" | head -50
          echo ""
          echo "=== Checking for q_net.pt files ==="
          find results/ -name "q_net.pt" | head -30
          echo ""
          echo "=== Checking for episodes.csv files ==="
          find results/ -name "episodes.csv" | head -30

      - name: Upload All Combined Results
        uses: actions/upload-artifact@v4
        with:
          name: single_agent_combined_results_${{ github.event.inputs.grid_size || '6x6' }}
          path: results/
          retention-days: 14

      - name: Generate Evaluation Plots & Statistical Analysis
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          GRID_SIZE="${{ github.event.inputs.grid_size || '6x6' }}"
          for env in "MiniGrid-Empty-Random-${GRID_SIZE}-v0" "MiniGrid-DoorKey-${GRID_SIZE}-v0"; do
            PLOTS_DIR="plots/plots_${env}_${GRID_SIZE}_single_agent_${TIMESTAMP}"
            mkdir -p "$PLOTS_DIR"
            echo ""
            echo "============================================================"
            echo "Generating evaluation plots for $env in $PLOTS_DIR..."
            echo "============================================================"

            echo "--- Reward Comparison Plots ---"
            python src/plot_comparison.py --env-id $env --plots-dir "${PLOTS_DIR}/reward_comparison" || echo "plot_comparison failed for $env"

            echo "--- Q-Value Overestimation Plots ---"
            python src/plot_q_overestimation.py --env-id $env --plots-dir "$PLOTS_DIR" || echo "plot_q_overestimation failed for $env"

            echo "--- Testing Heatmaps (Deterministic + 5% Epsilon) ---"
            python src/plot_state_action_freq.py --env-id $env --plots-dir "${PLOTS_DIR}/reward_comparison" || echo "plot_state_action_freq failed for $env"

            echo "--- Training Action Analysis (JSON) ---"
            python src/plot_training_action_freq.py --env-id $env --plots-dir "${PLOTS_DIR}/action_freq" || echo "plot_training_action_freq failed for $env"

            echo "--- Statistical Analysis ---"
            python src/statistical_analysis.py --results-dir results --env-id $env --output-dir "$PLOTS_DIR" || echo "statistical_analysis failed for $env"
          done

      - name: Commit and Push Evaluation Plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plots/
          git commit -m "Auto-generated single agent (multi-seed) evaluation plots" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
