name: Run Experiments (Curriculum)

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.agent }}, ${{ matrix.env_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        env_id:
          - MiniGrid-Empty-6x6-v0
          - MiniGrid-DoorKey-6x6-v0
          - MiniGrid-FourRooms-v0
          - MiniGrid-MultiRoom-N2-S4-v0
        agent:
          - random_agent
          - dqn_baseline
          - dqn_reward_shaping

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: "Run Agent (Curriculum: 3 Stages, 200k Steps Each)"
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          TIMESTEPS=200000
          EXPLORE_FRAC=0.60
          
          if [ "${{ matrix.agent }}" == "random_agent" ]; then
            # =====================================================================
            # RANDOM AGENT BASELINE
            # =====================================================================
            # The random agent doesn't learn, so it doesn't need curriculum stages 
            # or model loading. However, to ensure our plotting scripts can compare 
            # it fairly against the DQN agents, we generate a continuous 600k step 
            # log by running it 3 times sequentially and appending to the same CSV.
            
            # Use a single dedicated output directory for all 3 runs
            RUN_DIR="results/${{ matrix.env_id }}__${{ matrix.agent }}__curriculum"
            
            for stage in 1 2 3; do
              echo "Running random_agent stage $stage"
              
              # Calculate the starting step number for this stage's log entries.
              # Stage 1: 0, Stage 2: 200000, Stage 3: 400000
              OFFSET=$(( (stage - 1) * TIMESTEPS ))
              
              python src/${{ matrix.agent }}.py \
                --env-id ${{ matrix.env_id }} \
                --total-timesteps $TIMESTEPS \
                --seed $stage \
                --max-steps $MAX_STEPS \
                --fixed-layout \
                --run-dir $RUN_DIR \
                --global-step-offset $OFFSET
            done
          else
            # =====================================================================
            # DQN AGENTS: CURRICULUM LEARNING (Stage 1 -> Stage 2 -> Stage 3)
            # =====================================================================
            # To train the agents progressively, we run 3 separate python commands.
            # Each command represents a stage in the curriculum. We pass the trained 
            # neural network weights from one stage to the next using --load-model.
            # All 3 stages write to the same RUN_DIR so the logs are concatenated 
            # into a single, continuous 600k step learning curve.
            
            RUN_DIR="results/${{ matrix.env_id }}__${{ matrix.agent }}__curriculum"
            
            # --- STAGE 1 (Easy) ---
            # The CurriculumWrapper forces the Goal/Key to spawn very close to the agent.
            echo "--- STAGE 1 (Easy) ---"
            python src/${{ matrix.agent }}.py \
              --env-id ${{ matrix.env_id }} \
              --total-timesteps $TIMESTEPS \
              --seed 1 \
              --max-steps $MAX_STEPS \
              --exploration-fraction $EXPLORE_FRAC \
              --fixed-layout \
              --curriculum-stage 1 \
              --run-dir $RUN_DIR
              
            # The model is saved to q_net.pt in the run directory at the end of Stage 1.
            MODEL_PATH="$RUN_DIR/q_net.pt"
            
            # --- STAGE 2 (Medium) ---
            # The Goal/Key spawn a medium distance away. 
            # We load the weights from Stage 1 so the agent doesn't start from scratch.
            # We offset the logging steps by 200,000 so the CSV continues seamlessly.
            echo "--- STAGE 2 (Medium) ---"
            python src/${{ matrix.agent }}.py \
              --env-id ${{ matrix.env_id }} \
              --total-timesteps $TIMESTEPS \
              --seed 2 \
              --max-steps $MAX_STEPS \
              --exploration-fraction $EXPLORE_FRAC \
              --fixed-layout \
              --curriculum-stage 2 \
              --load-model $MODEL_PATH \
              --run-dir $RUN_DIR \
              --global-step-offset 200000
              
            # --- STAGE 3 (Hard) ---
            # The environment is fully randomized (default MiniGrid behavior).
            # The agent must now solve the standard environment using what it learned.
            echo "--- STAGE 3 (Hard) ---"
            python src/${{ matrix.agent }}.py \
              --env-id ${{ matrix.env_id }} \
              --total-timesteps $TIMESTEPS \
              --seed 3 \
              --max-steps $MAX_STEPS \
              --exploration-fraction $EXPLORE_FRAC \
              --fixed-layout \
              --curriculum-stage 3 \
              --load-model $MODEL_PATH \
              --run-dir $RUN_DIR \
              --global-step-offset 400000
          fi
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: result_${{ matrix.agent }}_${{ matrix.env_id }}
          path: results/
          retention-days: 14

  plot:
    name: Generate Plots & Push to Repo
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result_*
          path: results/
          merge-multiple: true
          
      - name: Generate Comparison and Heatmap Plots
        run: |
          for env in "MiniGrid-Empty-6x6-v0" "MiniGrid-DoorKey-6x6-v0" "MiniGrid-FourRooms-v0" "MiniGrid-MultiRoom-N2-S4-v0"; do
            echo "Plotting $env..."
            python src/plot_comparison.py --env-id $env
            python src/plot_state_action_freq.py --env-id $env
          done
          
      - name: Commit and Push Plots
        run: |
          # Create timestamped plots directory inside plots/
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          DIR_NAME="plots/plots_$TIMESTAMP"
          mkdir -p $DIR_NAME
          
          # Move all generated .png files into the new directory
          mv plots/*.png $DIR_NAME/
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes to avoid conflicts, add plots, commit, and push
          git pull origin main
          git add $DIR_NAME/
          git commit -m "Auto-generated plots for 100k steps ($TIMESTAMP)" || echo "No changes to commit"
          git push origin main
