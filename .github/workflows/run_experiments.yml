name: Run Experiments (100k Steps)

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.agent }}, ${{ matrix.env_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        env_id:
          - MiniGrid-Empty-6x6-v0
          - MiniGrid-DoorKey-6x6-v0
          - MiniGrid-FourRooms-v0
          - MiniGrid-MultiRoom-N2-S4-v0
        agent:
          - random_agent
          - dqn_baseline
          - dqn_reward_shaping

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: "Run Agent (Curriculum: 3 Stages, 200k Steps Each)"
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          TIMESTEPS=200000
          EXPLORE_FRAC=0.60
          
          if [ "${{ matrix.agent }}" == "random_agent" ]; then
            # Random agent doesn't learn, so it doesn't need a curriculum or loaded models.
            # We just run it 3 times sequentially to generate 3 logs that match the DQNs.
            # We use a single run-dir and step offsets so it outputs a continuous 600k log.
            RUN_DIR="results/${{ matrix.env_id }}__${{ matrix.agent }}__curriculum"
            for stage in 1 2 3; do
              echo "Running random_agent stage $stage"
              OFFSET=$(( (stage - 1) * TIMESTEPS ))
              python src/${{ matrix.agent }}.py \
                --env-id ${{ matrix.env_id }} \
                --total-timesteps $TIMESTEPS \
                --seed $stage \
                --max-steps $MAX_STEPS \
                --fixed-layout \
                --run-dir $RUN_DIR \
                --global-step-offset $OFFSET
            done
          else
            # DQN Agents: Curriculum Learning (Stage 1 -> Stage 2 -> Stage 3)
            RUN_DIR="results/${{ matrix.env_id }}__${{ matrix.agent }}__curriculum"
            
            # Stage 1: Easy (Goal/Key very close)
            echo "--- STAGE 1 (Easy) ---"
            python src/${{ matrix.agent }}.py \
              --env-id ${{ matrix.env_id }} \
              --total-timesteps $TIMESTEPS \
              --seed 1 \
              --max-steps $MAX_STEPS \
              --exploration-fraction $EXPLORE_FRAC \
              --fixed-layout \
              --curriculum-stage 1 \
              --run-dir $RUN_DIR
              
            MODEL_PATH="$RUN_DIR/q_net.pt"
            
            # Stage 2: Medium (Goal/Key medium distance)
            echo "--- STAGE 2 (Medium) ---"
            python src/${{ matrix.agent }}.py \
              --env-id ${{ matrix.env_id }} \
              --total-timesteps $TIMESTEPS \
              --seed 2 \
              --max-steps $MAX_STEPS \
              --exploration-fraction $EXPLORE_FRAC \
              --fixed-layout \
              --curriculum-stage 2 \
              --load-model $MODEL_PATH \
              --run-dir $RUN_DIR \
              --global-step-offset 200000
              
            # Stage 3: Hard (Fully Randomized)
            echo "--- STAGE 3 (Hard) ---"
            python src/${{ matrix.agent }}.py \
              --env-id ${{ matrix.env_id }} \
              --total-timesteps $TIMESTEPS \
              --seed 3 \
              --max-steps $MAX_STEPS \
              --exploration-fraction $EXPLORE_FRAC \
              --fixed-layout \
              --curriculum-stage 3 \
              --load-model $MODEL_PATH \
              --run-dir $RUN_DIR \
              --global-step-offset 400000
          fi
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: result_${{ matrix.agent }}_${{ matrix.env_id }}
          path: results/
          retention-days: 14

  plot:
    name: Generate Plots & Push to Repo
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result_*
          path: results/
          merge-multiple: true
          
      - name: Generate Comparison and Heatmap Plots
        run: |
          for env in "MiniGrid-Empty-6x6-v0" "MiniGrid-DoorKey-6x6-v0" "MiniGrid-FourRooms-v0" "MiniGrid-MultiRoom-N2-S4-v0"; do
            echo "Plotting $env..."
            python src/plot_comparison.py --env-id $env
            python src/plot_state_action_freq.py --env-id $env
          done
          
      - name: Commit and Push Plots
        run: |
          # Create timestamped plots directory inside plots/
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          DIR_NAME="plots/plots_$TIMESTAMP"
          mkdir -p $DIR_NAME
          
          # Move all generated .png files into the new directory
          mv plots/*.png $DIR_NAME/
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes to avoid conflicts, add plots, commit, and push
          git pull origin main
          git add $DIR_NAME/
          git commit -m "Auto-generated plots for 100k steps ($TIMESTAMP)" || echo "No changes to commit"
          git push origin main
