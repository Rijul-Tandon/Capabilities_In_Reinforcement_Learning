name: Run Experiments (200k Steps)

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      grid_size:
        description: 'Environment grid size'
        required: false
        default: '6x6'
        type: choice
        options:
          - 6x6
          - 8x8
          - 16x16
      num_seeds:
        description: 'Number of seeds to run (1 to 5)'
        required: false
        default: '3'
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'
      exploration_strategy:
        description: 'Exploration strategy: epsilon_greedy or softmax'
        required: false
        default: 'epsilon_greedy'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.agent }}, ${{ matrix.env_id }}, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        include:
          # --- Random Agent ---
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: random_agent
            decay: linear
            seed: 1
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: random_agent
            decay: linear
            seed: 1

          # --- MiniGrid-Empty-Random-6x6-v0 ---
          # Seed 1: baseline linear, reward shaping linear
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 1
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_reward_shaping
            decay: linear
            seed: 1

          # Seed 2: baseline linear, reward shaping exponential
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 2
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_reward_shaping
            decay: exponential
            seed: 2

          # Seed 3: baseline polynomial, reward shaping exponential
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_baseline
            decay: polynomial
            seed: 3
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_reward_shaping
            decay: exponential
            seed: 3

          # Seeds 4 & 5 (optional extended runs)
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 4
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_reward_shaping
            decay: polynomial
            seed: 4
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 5
          - env_id: MiniGrid-Empty-Random-6x6-v0
            agent: ddqn_reward_shaping
            decay: polynomial
            seed: 5

          # --- MiniGrid-DoorKey-6x6-v0 ---
          # Seed 1: baseline linear, reward shaping linear
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 1
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_reward_shaping
            decay: linear
            seed: 1

          # Seed 2: baseline linear, reward shaping exponential
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 2
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_reward_shaping
            decay: exponential
            seed: 2

          # Seed 3: baseline polynomial, reward shaping exponential
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_baseline
            decay: polynomial
            seed: 3
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_reward_shaping
            decay: exponential
            seed: 3

          # Seeds 4 & 5 (optional extended runs)
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 4
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_reward_shaping
            decay: polynomial
            seed: 4
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_baseline
            decay: linear
            seed: 5
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_reward_shaping
            decay: polynomial
            seed: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: "Run Agent (Dynamic Steps, environment-specific decay schedules)"
        run: |
          NUM_SEEDS="${{ github.event.inputs.num_seeds || '3' }}"
          if [ "${{ matrix.seed }}" -gt "$NUM_SEEDS" ]; then
            echo "Skipping seed ${{ matrix.seed }} (requested num_seeds=$NUM_SEEDS)"
            exit 0
          fi

          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          GRID_SIZE="${{ github.event.inputs.grid_size || '6x6' }}"
          
          # Replace 6x6 in the matrix env_id with the selected grid_size
          ENV_ID=$(echo "${{ matrix.env_id }}" | sed "s/6x6/$GRID_SIZE/")

          if [ "$GRID_SIZE" = "16x16" ]; then
            TIMESTEPS=1000000
          elif [ "$GRID_SIZE" = "8x8" ]; then
            TIMESTEPS=500000
          else
            TIMESTEPS=200000
          fi

          EXPLORE_FRAC=0.50
          STRATEGY="${{ github.event.inputs.exploration_strategy || 'epsilon_greedy' }}"
          
          python src/${{ matrix.agent }}.py \
            --env-id $ENV_ID \
            --total-timesteps $TIMESTEPS \
            --seed ${{ matrix.seed }} \
            --max-steps $MAX_STEPS \
            --exploration-fraction $EXPLORE_FRAC \
            --epsilon-schedule ${{ matrix.decay }} \
            --exploration-strategy $STRATEGY \
            --fixed-layout
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: result_${{ matrix.agent }}_${{ matrix.env_id }}_${{ github.event.inputs.grid_size || '6x6' }}_seed${{ matrix.seed }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  plot:
    name: Generate Plots & Push to Repo
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: result_*
          path: results/
          merge-multiple: true
          
      - name: Generate All Comparison and Analysis Plots
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          PLOTS_DIR="plots/plots_${TIMESTAMP}"
          mkdir -p "$PLOTS_DIR"
          
          GRID_SIZE="${{ github.event.inputs.grid_size || '6x6' }}"
          for env in "MiniGrid-Empty-Random-${GRID_SIZE}-v0" "MiniGrid-DoorKey-${GRID_SIZE}-v0"; do
            echo "Generating all plots for $env..."
            python src/plot_comparison.py --env-id $env --plots-dir "${PLOTS_DIR}/reward_comparison"
            python src/plot_q_overestimation.py --env-id $env --plots-dir "$PLOTS_DIR"
            python src/plot_state_action_freq.py --env-id $env --plots-dir "${PLOTS_DIR}/reward_comparison"
            python src/plot_training_action_freq.py --env-id $env --plots-dir "${PLOTS_DIR}/action_freq"
          done
          
      - name: Commit and Push Plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plots/
          git commit -m "Auto-generated timestamped structured evaluation plots" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
