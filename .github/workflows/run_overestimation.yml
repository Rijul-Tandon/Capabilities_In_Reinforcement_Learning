name: Run Overestimation Comparison (Baseline vs Shaped × Exploration)

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.exp_name }}, ${{ matrix.env_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        env_id:
          - MiniGrid-Empty-6x6-v0
          - MiniGrid-DoorKey-6x6-v0
          # - MiniGrid-FourRooms-v0
          # - MiniGrid-MultiRoom-N2-S4-v0
        agent:
          - ddqn_baseline
          - ddqn_reward_shaping
        exploration:
          - epsilon_greedy
          - softmax
        include:
          # Override exp_name for each combination so run directories are unique
          - agent: ddqn_baseline
            exploration: epsilon_greedy
            exp_name: ddqn_baseline
          - agent: ddqn_baseline
            exploration: softmax
            exp_name: ddqn_baseline_softmax
          - agent: ddqn_reward_shaping
            exploration: epsilon_greedy
            exp_name: ddqn_reward_shaping
          - agent: ddqn_reward_shaping
            exploration: softmax
            exp_name: ddqn_reward_shaping_softmax

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Agent
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          TIMESTEPS=300000
          EXPLORE_FRAC=0.50
          
          python src/${{ matrix.agent }}.py \
            --env-id ${{ matrix.env_id }} \
            --total-timesteps $TIMESTEPS \
            --seed 1 \
            --max-steps $MAX_STEPS \
            --exploration-fraction $EXPLORE_FRAC \
            --exploration-strategy ${{ matrix.exploration }} \
            --exp-name ${{ matrix.exp_name }} \
            --fixed-layout
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: overestimation_${{ matrix.exp_name }}_${{ matrix.env_id }}
          path: results/
          retention-days: 14

  plot:
    name: Generate Q-Value Overestimation Plots & Push
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: overestimation_*
          path: results/
          merge-multiple: true
          
      - name: Generate Q-Value Overestimation Plots
        run: |
          # Comparison 1: Same exploration (epsilon-greedy)
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline ddqn_reward_shaping \
            --label-a "Baseline (ε-greedy)" \
            --label-b "Shaped (ε-greedy)"

          # Comparison 2: Cross-strategy — Baseline ε-greedy vs Shaped softmax
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline ddqn_reward_shaping_softmax \
            --label-a "Baseline (ε-greedy)" \
            --label-b "Shaped (Softmax)"

          # Comparison 3: Cross-strategy — Baseline softmax vs Shaped ε-greedy
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline_softmax ddqn_reward_shaping \
            --label-a "Baseline (Softmax)" \
            --label-b "Shaped (ε-greedy)"

          # Comparison 4: Same exploration (softmax)
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline_softmax ddqn_reward_shaping_softmax \
            --label-a "Baseline (Softmax)" \
            --label-b "Shaped (Softmax)"
          
      - name: Commit and Push Plots
        run: |
          # Create timestamped plots directory inside plots/
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          DIR_NAME="plots/overestimation_$TIMESTAMP"
          mkdir -p $DIR_NAME
          
          # Move all generated comparison folders into the new directory
          mv plots/*_vs_*/ $DIR_NAME/ 2>/dev/null || true
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add plots, commit, pull rebase to resolve concurrent pushes, and push
          git add $DIR_NAME/
          git commit -m "Auto-generated Baseline vs Shaped overestimation plots ($TIMESTAMP)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
