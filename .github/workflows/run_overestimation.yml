name: Q-Value Overestimation & Strategy Comparison

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.exp_name }}, ${{ matrix.env_id }}, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        seed: [1, 2, 3, 4, 5]
        include:
          # --- MiniGrid-Empty-6x6-v0 ---
          # Baseline: linear decay
          - env_id: MiniGrid-Empty-6x6-v0
            agent: ddqn_baseline
            exploration: epsilon_greedy
            exp_name: ddqn_baseline
            decay: linear
          - env_id: MiniGrid-Empty-6x6-v0
            agent: ddqn_baseline
            exploration: softmax
            exp_name: ddqn_baseline_softmax
            decay: linear

          # Reward Shaped: polynomial decay
          - env_id: MiniGrid-Empty-6x6-v0
            agent: ddqn_reward_shaping
            exploration: epsilon_greedy
            exp_name: ddqn_reward_shaping
            decay: polynomial
          - env_id: MiniGrid-Empty-6x6-v0
            agent: ddqn_reward_shaping
            exploration: softmax
            exp_name: ddqn_reward_shaping_softmax
            decay: polynomial

          # --- MiniGrid-DoorKey-6x6-v0 ---
          # Baseline: exponential decay
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_baseline
            exploration: epsilon_greedy
            exp_name: ddqn_baseline
            decay: exponential
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_baseline
            exploration: softmax
            exp_name: ddqn_baseline_softmax
            decay: exponential

          # Reward Shaped: cosine decay
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_reward_shaping
            exploration: epsilon_greedy
            exp_name: ddqn_reward_shaping
            decay: cosine
          - env_id: MiniGrid-DoorKey-6x6-v0
            agent: ddqn_reward_shaping
            exploration: softmax
            exp_name: ddqn_reward_shaping_softmax
            decay: cosine

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Agent
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          TIMESTEPS=300000
          EXPLORE_FRAC=0.50
          
          python src/${{ matrix.agent }}.py \
            --env-id ${{ matrix.env_id }} \
            --total-timesteps $TIMESTEPS \
            --seed ${{ matrix.seed }} \
            --max-steps $MAX_STEPS \
            --exploration-fraction $EXPLORE_FRAC \
            --epsilon-schedule ${{ matrix.decay }} \
            --end-e 0.1 \
            --exploration-strategy ${{ matrix.exploration }} \
            --exp-name ${{ matrix.exp_name }} \
            --fixed-layout
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: overestimation_${{ matrix.exp_name }}_${{ matrix.env_id }}_seed${{ matrix.seed }}
          path: results/
          retention-days: 14

  plot:
    name: Generate Q-Value Overestimation Plots & Push
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: overestimation_*
          path: results/
          merge-multiple: true
          
      - name: Generate Q-Overestimation Plots
        run: |
          # 1. Baseline DDQN (eps-greedy) vs Reward-Shaped DDQN (eps-greedy) [Same exploration]
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline ddqn_reward_shaping \
            --label-a "Baseline (eps-greedy)" \
            --label-b "Shaped (eps-greedy)"

          # 2. Baseline DDQN (softmax) vs Reward-Shaped DDQN (softmax) [Same exploration]
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline_softmax ddqn_reward_shaping_softmax \
            --label-a "Baseline (softmax)" \
            --label-b "Shaped (softmax)"

          # 3. Baseline DDQN (eps-greedy) vs Reward-Shaped DDQN (softmax) [Cross exploration]
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline ddqn_reward_shaping_softmax \
            --label-a "Baseline (eps-greedy)" \
            --label-b "Shaped (softmax)"

          # 4. Baseline DDQN (softmax) vs Reward-Shaped DDQN (eps-greedy) [Cross exploration]
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline_softmax ddqn_reward_shaping \
            --label-a "Baseline (softmax)" \
            --label-b "Shaped (eps-greedy)"

      - name: Commit and Push Plots
        run: |
          # Create timestamped plots directory inside plots/
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          DIR_NAME="plots/overestimation_$TIMESTAMP"
          mkdir -p $DIR_NAME
          
          # Move all generated comparison folders into the new directory
          mv plots/*_vs_*/ $DIR_NAME/ 2>/dev/null || true
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add plots, commit, pull rebase to resolve concurrent pushes, and push
          git add $DIR_NAME/
          git commit -m "Auto-generated Baseline vs Shaped overestimation plots ($TIMESTAMP)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
