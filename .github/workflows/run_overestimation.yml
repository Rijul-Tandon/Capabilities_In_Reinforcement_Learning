name: Q-Value Overestimation Comparison

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      grid_size:
        description: 'Environment grid size'
        required: false
        default: '6x6'
        type: choice
        options:
          - 6x6
          - 8x8
          - 10x10
      num_seeds:
        description: 'Number of seeds to run (1 to 5)'
        required: false
        default: '3'
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.agent }}, ${{ matrix.env_id }}, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        env_id: [MiniGrid-Empty-6x6-v0, MiniGrid-DoorKey-6x6-v0]
        agent: [ddqn_baseline, ddqn_reward_shaping]
        seed: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Agent
        run: |
          NUM_SEEDS="${{ github.event.inputs.num_seeds || '3' }}"
          if [ "${{ matrix.seed }}" -gt "$NUM_SEEDS" ]; then
            echo "Skipping seed ${{ matrix.seed }} (requested num_seeds=$NUM_SEEDS)"
            exit 0
          fi

          GRID_SIZE="${{ github.event.inputs.grid_size || '6x6' }}"
          ENV_ID=$(echo "${{ matrix.env_id }}" | sed "s/6x6/$GRID_SIZE/")

          if [ "$GRID_SIZE" = "10x10" ]; then
            TIMESTEPS=1000000
            EXPLORE_FRAC=0.80
            END_E=0.1
          elif [ "$GRID_SIZE" = "8x8" ]; then
            TIMESTEPS=500000
            EXPLORE_FRAC=0.50
            END_E=0.1
          else
            TIMESTEPS=200000
            EXPLORE_FRAC=0.50
            END_E=0.1
          fi

          # Determine specific decay schedule based on seed and agent
          DECAY="linear"
          SEED="${{ matrix.seed }}"
          AGENT="${{ matrix.agent }}"

          if [ "$SEED" = "1" ]; then
            DECAY="linear"
          elif [ "$SEED" = "2" ]; then
            if [ "$AGENT" = "ddqn_baseline" ]; then
              DECAY="linear"
            else
              DECAY="exponential"
            fi
          elif [ "$SEED" = "3" ]; then
            if [ "$AGENT" = "ddqn_baseline" ]; then
              DECAY="polynomial"
            else
              DECAY="exponential"
            fi
          else
            if [ "$AGENT" = "ddqn_baseline" ]; then
              DECAY="linear"
            else
              DECAY="polynomial"
            fi
          fi

          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          
          python src/${{ matrix.agent }}.py \
            --env-id $ENV_ID \
            --total-timesteps $TIMESTEPS \
            --seed ${{ matrix.seed }} \
            --max-steps $MAX_STEPS \
            --exploration-fraction $EXPLORE_FRAC \
            --epsilon-schedule $DECAY \
            --end-e $END_E \
            --exploration-strategy epsilon_greedy \
            --exp-name ${{ matrix.agent }} \
            --fixed-layout
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: overestimation_${{ matrix.agent }}_${{ matrix.env_id }}_seed${{ matrix.seed }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  plot:
    name: Generate Q-Value Overestimation Plots & Push
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: overestimation_*
          path: results/
          merge-multiple: true
          
      - name: Generate Q-Overestimation Plots
        run: |
          python src/plot_q_overestimation.py \
            --compare ddqn_baseline ddqn_reward_shaping \
            --label-a "Baseline DDQN" \
            --label-b "Shaped DDQN"

      - name: Commit and Push Plots
        run: |
          # Create timestamped plots directory inside plots/
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          DIR_NAME="plots/overestimation_$TIMESTAMP"
          mkdir -p $DIR_NAME
          
          # Move all generated comparison folders into the new directory
          mv plots/*_vs_*/ $DIR_NAME/ 2>/dev/null || true
          mv plots/*.png $DIR_NAME/ 2>/dev/null || true
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add plots, commit, pull rebase to resolve concurrent pushes, and push
          git add $DIR_NAME/
          git commit -m "Auto-generated Baseline vs Shaped overestimation plots ($TIMESTAMP)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
