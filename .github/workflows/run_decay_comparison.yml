name: Run Epsilon Decay Comparison

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train (${{ matrix.agent }}, ${{ matrix.decay }}, ${{ matrix.env_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        env_id:
          - MiniGrid-Empty-6x6-v0
          - MiniGrid-DoorKey-6x6-v0
          # - MiniGrid-FourRooms-v0
          # - MiniGrid-MultiRoom-N2-S4-v0
        agent:
          - ddqn_baseline
          - ddqn_reward_shaping
        decay:
          - linear
          - hardcoded
          - polynomial
          - cosine
          - exponential
          - cyclic

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Agent with Epsilon Decay Schedule
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          TIMESTEPS=300000
          EXPLORE_FRAC=0.50
          EXP_NAME="${{ matrix.agent }}_decay_${{ matrix.decay }}"
          
          python src/${{ matrix.agent }}.py \
            --env-id ${{ matrix.env_id }} \
            --total-timesteps $TIMESTEPS \
            --seed 1 \
            --max-steps $MAX_STEPS \
            --exploration-fraction $EXPLORE_FRAC \
            --epsilon-schedule ${{ matrix.decay }} \
            --end-e 0.1 \
            --exploration-strategy epsilon_greedy \
            --exp-name $EXP_NAME \
            --fixed-layout
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: decay_${{ matrix.agent }}_${{ matrix.decay }}_${{ matrix.env_id }}
          path: results/
          retention-days: 14

  plot:
    name: Generate Epsilon Decay Comparison Plots & Push
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: decay_*
          path: results/
          merge-multiple: true
          
      - name: Generate Comparison Plots
        run: |
          for env in "MiniGrid-Empty-6x6-v0" "MiniGrid-DoorKey-6x6-v0"; do
            echo "Plotting decay curves for $env..."
            python src/plot_comparison.py --env-id $env --decay-comparison
          done
          
      - name: Commit and Push Plots
        run: |
          # Create timestamped plots directory inside plots/
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          DIR_NAME="plots/decay_comparison_$TIMESTAMP"
          mkdir -p $DIR_NAME
          
          # Move all generated comparison plots into the new directory
          mv plots/*.png $DIR_NAME/ 2>/dev/null || true
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit, pull rebase to avoid push conflicts, and push
          git add $DIR_NAME/
          git commit -m "Auto-generated Epsilon Decay comparison plots ($TIMESTAMP)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
