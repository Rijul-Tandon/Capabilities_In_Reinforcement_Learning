name: Run Epsilon Decay Comparison

on:
  workflow_dispatch:  # Trigger manually from GitHub UI or `gh workflow run`
    inputs:
      grid_size:
        description: 'Environment grid size'
        required: false
        default: '6x6'
        type: choice
        options:
          - 6x6
          - 8x8
          - 10x10
      num_seeds:
        description: 'Number of seeds to run (1 to 5)'
        required: false
        default: '3'
      max_steps:
        description: 'Max steps per episode (-1 = env default)'
        required: false
        default: '-1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    name: Train Decay (${{ matrix.agent }}, ${{ matrix.decay }}, ${{ matrix.env_id }}, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # If one run fails, keep running the others
      matrix:
        env_id:
          - MiniGrid-Empty-6x6-v0
          - MiniGrid-DoorKey-6x6-v0
        agent:
          - ddqn_baseline
          - ddqn_reward_shaping
        decay:
          - linear
          - hardcoded
          - polynomial
          - cosine
          - exponential
          - cyclic
        seed:
          - 1
          - 2
          - 3
          - 4
          - 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Agent with Epsilon Decay Schedule
        run: |
          NUM_SEEDS="${{ github.event.inputs.num_seeds || '3' }}"
          if [ "${{ matrix.seed }}" -gt "$NUM_SEEDS" ]; then
            echo "Skipping seed ${{ matrix.seed }} (requested num_seeds=$NUM_SEEDS)"
            exit 0
          fi

          MAX_STEPS="${{ github.event.inputs.max_steps || '-1' }}"
          GRID_SIZE="${{ github.event.inputs.grid_size || '6x6' }}"
          ENV_ID=$(echo "${{ matrix.env_id }}" | sed "s/6x6/$GRID_SIZE/")

          if [ "$GRID_SIZE" = "10x10" ]; then
            TIMESTEPS=1000000
            EXPLORE_FRAC=0.80
            END_E=0.1
          elif [ "$GRID_SIZE" = "8x8" ]; then
            TIMESTEPS=500000
            EXPLORE_FRAC=0.50
            END_E=0.1
          else
            TIMESTEPS=200000
            EXPLORE_FRAC=0.50
            END_E=0.1
          fi

          EXP_NAME="${{ matrix.agent }}_decay_${{ matrix.decay }}"
          
          python src/${{ matrix.agent }}.py \
            --env-id $ENV_ID \
            --total-timesteps $TIMESTEPS \
            --seed ${{ matrix.seed }} \
            --max-steps $MAX_STEPS \
            --exploration-fraction $EXPLORE_FRAC \
            --epsilon-schedule ${{ matrix.decay }} \
            --end-e $END_E \
            --exploration-strategy epsilon_greedy \
            --exp-name $EXP_NAME \
            --fixed-layout
          
      - name: Upload Run Results
        uses: actions/upload-artifact@v4
        with:
          name: decay_${{ matrix.agent }}_${{ matrix.decay }}_${{ matrix.env_id }}_seed${{ matrix.seed }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  plot:
    name: Generate Epsilon Decay Comparison Plots & Push
    needs: train  # Wait for all matrix training jobs to finish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: decay_*
          path: results/
          merge-multiple: true
          
      - name: Generate Epsilon Decay Comparison Figures
        run: |
          for env in "MiniGrid-Empty-6x6-v0" "MiniGrid-DoorKey-6x6-v0"; do
            echo "Generating Decay Comparison plots for $env..."
            python src/plot_comparison.py --env-id $env --decay-comparison
          done
          
      - name: Commit and Push Plots
        run: |
          # Create timestamped plots directory inside plots/
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          DIR_NAME="plots/decay_comparison_$TIMESTAMP"
          mkdir -p $DIR_NAME
          
          # Move all generated decay comparison .png files into the new directory
          mv plots/*decay_comparison*.png $DIR_NAME/ 2>/dev/null || true
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add plots, commit, pull rebase to resolve concurrent pushes, and push
          git add $DIR_NAME/
          git commit -m "Auto-generated Epsilon Decay Comparison plots ($TIMESTAMP)" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
